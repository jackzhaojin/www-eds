# The www.jackzhaojin.com Worker (routing-cloudflare.md in jackzhaojin.github.io/ai-docs).
# Three Workers from this one script, after `wrangler login` (every deploy is Jack's call):
#   npx wrangler deploy --env=""        www-eds-edge, production: www.jackzhaojin.com, indexable
#   npx wrangler deploy --env staging   eds.jackzhaojin.com, the EDS site, noindex
#   npx wrangler deploy --env gh        gh.jackzhaojin.com, the GitHub Pages site, noindex
# The production route www.jackzhaojin.com/* is NOT in this file on purpose: it was added in the
# Cloudflare dashboard at the cutover (2026-10-26, about 15:12 ET; Workers & Pages > www-eds-edge >
# Domains, a Route, not a Custom Domain), so no deploy can add or move it. Rollback: remove it there.
# Vars are not inherited by an env: only the top level (www) sets INDEXABLE, so a host that is
# not www answers noindex.
name = "www-eds-edge"
main = "src/index.mjs"
compatibility_date = "2025-03-17"
workers_dev = false

[vars]
ORIGIN_HOSTNAME = "main--www-eds--jackzhaojin.aem.live"
# www: project sites go to the zone's own origin (GitHub Pages), untouched.
PROJECT_ORIGIN = "passthrough"
# www is the one host search engines may index.
INDEXABLE = "true"
# Until push invalidation is set up (the Cache Purge token in hlx-config/cdn-prod.json), aem.live
# would send long cache TTLs that nothing purges, so publishes wouldn't show. The cutover deployed
# with this override (--var PUSH_INVALIDATION:disabled, version fa323e37); it's here so a plain
# redeploy keeps it. Remove it once push invalidation works, then redeploy.
PUSH_INVALIDATION = "disabled"

[env.staging]
name = "www-eds-edge-staging"
routes = [{ pattern = "eds.jackzhaojin.com/*", zone_name = "jackzhaojin.com" }]

[env.staging.vars]
ORIGIN_HOSTNAME = "main--www-eds--jackzhaojin.aem.live"
# staging has no GitHub origin behind its hostname: project sites come from www.
PROJECT_ORIGIN = "https://www.jackzhaojin.com"
# Push invalidation is set up for the www zone at cutover (step 4); staging opts out.
PUSH_INVALIDATION = "disabled"

[env.gh]
name = "www-eds-edge-gh"
routes = [{ pattern = "gh.jackzhaojin.com/*", zone_name = "jackzhaojin.com" }]

[env.gh.vars]
# The whole GitHub Pages site, read through www while GitHub Pages still answers there. At
# cutover GitHub Pages moves to gh itself and this becomes the zone origin (cutover runbook).
MODE = "github"
GITHUB_ORIGIN = "https://www.jackzhaojin.com"
