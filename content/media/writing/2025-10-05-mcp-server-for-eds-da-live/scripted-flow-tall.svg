<svg viewBox="0 0 320 560" role="img" aria-labelledby="dg-t" xmlns="http://www.w3.org/2000/svg" width="320" height="560"><style>.n rect{stroke-width:1.5}.n text{font:500 13px Inter,system-ui,sans-serif;fill:#1c1a17;text-anchor:middle;dominant-baseline:middle}.n--fn rect{fill:#e6eef9;stroke:#2f6db5}.n--api rect{fill:#f8e7ea;stroke:#a8324f}.n--llm rect{fill:#ece9f8;stroke:#5b4bc4}.e{stroke:#57534d;stroke-width:1.5;fill:none}.head{fill:#57534d}</style><title id="dg-t">The scripted flow. Get Content calls the da.live source API with a GET. Edit Content calls the same GET, hands the HTML to Claude with AI scaffolding, then saves the result back to the source API.</title><defs><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="e" x1="160" y1="62" x2="160" y2="80" marker-end="url(#aht)"></line><line class="e" x1="160" y1="248" x2="160" y2="266" marker-end="url(#aht)"></line><line class="e" x1="160" y1="320" x2="160" y2="338" marker-end="url(#aht)"></line><line class="e" x1="160" y1="392" x2="160" y2="410" marker-end="url(#aht)"></line><g class="n n--fn"><rect x="60" y="10" width="200" height="52" rx="10"></rect><text x="160.0" y="36.0">Get Content</text></g><g class="n n--api"><rect x="60" y="82" width="200" height="52" rx="10"></rect><text x="160.0" y="99.0">admin.da.live/source</text><text x="160.0" y="118.0">GET</text></g><g class="n n--fn"><rect x="60" y="196" width="200" height="52" rx="10"></rect><text x="160.0" y="222.0">Edit Content</text></g><g class="n n--api"><rect x="60" y="268" width="200" height="52" rx="10"></rect><text x="160.0" y="285.0">admin.da.live/source</text><text x="160.0" y="304.0">GET</text></g><g class="n n--llm"><rect x="60" y="340" width="200" height="52" rx="10"></rect><text x="160.0" y="357.0">Claude with AI</text><text x="160.0" y="376.0">Scaffolding</text></g><g class="n n--api"><rect x="60" y="412" width="200" height="52" rx="10"></rect><text x="160.0" y="429.0">admin.da.live/source</text><text x="160.0" y="448.0">Save</text></g></svg>