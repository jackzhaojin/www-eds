<title id="s1-wide-t">Solution 1: upstream planning tools feed AEM author content fragments, which are published. A scheduler fetches the latest content from publish with GraphQL and raises a subscription event to two topics. Channel A and Channel B processors read their topics, deliver to their channels, and Channel B fetches images from publish.</title>
