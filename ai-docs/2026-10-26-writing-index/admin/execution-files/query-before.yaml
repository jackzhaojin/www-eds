version: 1
indices:
  default:
    include:
      - /**
    exclude:
      - /nav
      - /footer
      - /**/nav
      - /**/footer
      - /drafts/**
      - /talks/records/**
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
      published-time:
        select: head > meta[name="published-time"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
  talks:
    include:
      - /talks/records/**
    exclude:
      - /talks/records
      - /talks/records/
    target: /talks-index.json
    properties:
      id:
        select: head > meta[name="talk-id"]
        value: attribute(el, 'content')
      aliases:
        select: head > meta[name="talk-aliases"]
        value: attribute(el, 'content')
      order:
        select: head > meta[name="talk-order"]
        value: attribute(el, 'content')
      date:
        select: head > meta[name="talk-date"]
        value: attribute(el, 'content')
      kind:
        select: head > meta[name="talk-kind"]
        value: attribute(el, 'content')
      title:
        select: main h1
        value: textContent(el)
      event:
        select: head > meta[name="talk-event"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      status:
        select: head > meta[name="talk-status"]
        value: attribute(el, 'content')
      linkLabels:
        select: main ul li a
        values: textContent(el)
      linkUrls:
        select: main ul li a
        values: attribute(el, 'href')
