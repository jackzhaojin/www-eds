version: 1
# The query index (Admin API: /config/jackzhaojin/sites/www-eds/content/query.yaml). Every
# published page except the nav and footer fragments. The sitemap reads it, and skips pages
# whose robots metadata says noindex (the design system page).
indices:
  default:
    include:
      - '/**'
    exclude:
      - '/nav'
      - '/footer'
      - '/**/nav'
      - '/**/footer'
      - '/drafts/**'
      - '/docs/**'
      - '/talks/records/**'
    target: /query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: match(attribute(el, 'content'), 'https:\/\/[^/]+(\/.*)')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
      published-time:
        select: head > meta[name="published-time"]
        value: attribute(el, 'content')
      lastModified:
        select: none
        value: parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
  # One page per talk at /talks/<id>/ (since v1.1.1; the first records, under /talks/records/,
  # are unpublished). The hub /talks/ is generated from this index.
  talks:
    include:
      - /talks/**
    exclude:
      - /talks
      - /talks/
      - /talks/**/nav
      - /talks/**/footer
    target: /talks-index.json
    properties:
      id:
        select: head > meta[name="talk-id"]
        value: attribute(el, 'content')
      aliases:
        select: head > meta[name="talk-aliases"]
        value: attribute(el, 'content')
      order:
        select: head > meta[name="talk-order"]
        value: attribute(el, 'content')
      date:
        select: head > meta[name="talk-date"]
        value: attribute(el, 'content')
      kind:
        select: head > meta[name="talk-kind"]
        value: attribute(el, 'content')
      title:
        select: main h1
        value: textContent(el)
      event:
        select: head > meta[name="talk-event"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      status:
        select: head > meta[name="talk-status"]
        value: attribute(el, 'content')
      linkLabels:
        select: main .proof-links a
        values: textContent(el)
      linkUrls:
        select: main .proof-links a
        values: attribute(el, 'href')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
  writing:
    include:
      - /writing/**
    exclude:
      - /writing
      - /writing/
      - /writing/**/nav
      - /writing/**/footer
    target: /writing-index.json
    properties:
      title:
        select: main h1
        value: textContent(el)
      headingId:
        select: main h1
        value: attribute(el, 'id')
      date:
        select: head > meta[name="published-time"]
        value: attribute(el, 'content')
      summary:
        select: head > meta[name="listing-summary"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[name="listing-image"]
        value: attribute(el, 'content')
      socialImage:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      topics:
        select: head > meta[name="listing-topics"]
        value: attribute(el, 'content')
      readTime:
        select: head > meta[name="listing-reading-time"]
        value: attribute(el, 'content')
      videoTime:
        select: head > meta[name="listing-video-time"]
        value: attribute(el, 'content')
      talkUrl:
        select: head > meta[name="listing-talk-url"]
        value: attribute(el, 'content')
      talkLabel:
        select: head > meta[name="listing-talk-label"]
        value: attribute(el, 'content')
      talkNote:
        select: head > meta[name="listing-talk-note"]
        value: attribute(el, 'content')
      watchUrl:
        select: head > meta[name="listing-watch-url"]
        value: attribute(el, 'content')
      watchLabel:
        select: head > meta[name="listing-watch-label"]
        value: attribute(el, 'content')
      keywords:
        select: head > meta[name="listing-keywords"]
        value: attribute(el, 'content')
      nowrap:
        select: head > meta[name="listing-nowrap"]
        value: attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
  # One page per portfolio project at /portfolio/<slug>/ (since v1.1.1). The hub /portfolio/
  # lists them from this index (Row list (projects, dynamic)).
  portfolio:
    include:
      - /portfolio/**
    exclude:
      - /portfolio
      - /portfolio/
      - /portfolio/**/nav
      - /portfolio/**/footer
    target: /portfolio-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: attribute(el, 'content')
      tagline:
        select: main h1 em
        value: textContent(el)
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      dates:
        select: head > meta[name="project-dates"]
        value: attribute(el, 'content')
      kind:
        select: head > meta[name="project-kind"]
        value: attribute(el, 'content')
      order:
        select: head > meta[name="project-order"]
        value: attribute(el, 'content')
      anchors:
        select: head > meta[name="project-anchors"]
        value: attribute(el, 'content')
      robots:
        select: head > meta[name="robots"]
        value: attribute(el, 'content')
